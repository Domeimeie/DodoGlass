# Local infrastructure for the transcoder: object storage (RustFS) and an MQTT broker (Mosquitto).
# Start with: docker compose up   (from this folder)
# The transcoder itself runs natively and reaches both through localhost.
services:
  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    ports: ["1883:1883"]
    volumes:
      # :Z lets the container read the file under SELinux (Fedora)
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro,Z

  rustfs:
    image: rustfs/rustfs:1.0.4
    ports:
      - "9000:9000" # S3 API (the transcoder talks to this)
      - "9001:9001" # web console
    environment:
      RUSTFS_VOLUMES: /data
      # Bucket events -> MQTT targets; the suffix names the target. A target has one topic, so
      # each topic is a target of its own.
      RUSTFS_NOTIFY_ENABLE: "true"
      # "primary": uploads to ingest, for the transcoders
      RUSTFS_NOTIFY_MQTT_ENABLE_PRIMARY: "on"
      RUSTFS_NOTIFY_MQTT_BROKER_PRIMARY: mqtt://mosquitto:1883
      RUSTFS_NOTIFY_MQTT_TOPIC_PRIMARY: dodoglass/ingest
      RUSTFS_NOTIFY_MQTT_QOS_PRIMARY: "1"
      # "final": new output markers in final, for the asset server (ADR 0006)
      RUSTFS_NOTIFY_MQTT_ENABLE_FINAL: "on"
      RUSTFS_NOTIFY_MQTT_BROKER_FINAL: mqtt://mosquitto:1883
      RUSTFS_NOTIFY_MQTT_TOPIC_FINAL: dodoglass/final
      RUSTFS_NOTIFY_MQTT_QOS_FINAL: "1"
    volumes:
      - rustfs-data:/data
    depends_on: [mosquitto]

  # Runs once and exits: creates the buckets and the event rules (infra/init.sh).
  # Uses the AWS CLI image, so the host needs no S3 client installed.
  init:
    image: amazon/aws-cli:2.39.5
    entrypoint: ["sh", "/init/init.sh"]
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://rustfs:9000
    volumes:
      - ./init.sh:/init/init.sh:ro,Z
      - ./ingest-notification.json:/init/ingest-notification.json:ro,Z
      - ./final-notification.json:/init/final-notification.json:ro,Z
    depends_on: [rustfs]
    restart: "no"

volumes:
  rustfs-data:
