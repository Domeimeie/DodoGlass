version: '3'

tasks:
  up:
    desc: Start RustFS + Mosquitto in the background and set up buckets and the event rule
    cmds:
      - docker compose up -d
      - docker compose logs init --follow --no-log-prefix

  down:
    desc: Stop the infrastructure (bucket contents are kept)
    cmds:
      - docker compose down

  reset:
    desc: Stop the infrastructure and DELETE all bucket contents, then start fresh
    prompt: This deletes everything stored in RustFS. Continue?
    cmds:
      - docker compose down --volumes
      - task: up

  logs:
    desc: Follow the logs of RustFS and Mosquitto
    cmds:
      - docker compose logs --follow rustfs mosquitto

  ps:
    desc: Show which containers are running
    cmds:
      - docker compose ps --all

  watch:
    desc: Print every MQTT message on the dodoglass/ topics (needs mosquitto_sub, or uses the container's)
    interactive: true
    cmds:
      - docker compose exec mosquitto mosquitto_sub -t 'dodoglass/#' -v

  upload:
    desc: 'Upload a video to the ingest bucket, e.g. go-task infra:upload -- application/transcoder/sample.mp4'
    cmds:
      # Streams the file through stdin into the AWS CLI container (no local S3 client, no mount).
      - |
        f="{{.CLI_ARGS}}"
        case "$f" in /*) ;; *) f="{{.USER_WORKING_DIR}}/$f" ;; esac
        test -f "$f" || { echo "no such file: $f" >&2; exit 1; }
        docker compose run --rm -T --no-deps --entrypoint aws init \
          s3 cp - "s3://ingest/$(basename "$f")" < "$f"
        echo "uploaded $(basename "$f") to s3://ingest/"

  ls:
    desc: 'List a bucket, e.g. go-task infra:ls -- final (default: both buckets)'
    cmds:
      - |
        for b in {{.CLI_ARGS | default "ingest final"}}; do
          echo "== s3://$b"
          docker compose run --rm -T --no-deps --entrypoint aws init s3 ls --recursive --human-readable "s3://$b/"
        done
